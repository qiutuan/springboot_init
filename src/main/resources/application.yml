# ============================================================
# 公共配置（所有环境生效）
# 环境差异配置见 application-dev.yml / application-prod.yml
# 激活方式：SPRING_PROFILES_ACTIVE=prod（默认 dev）
# ============================================================

server:
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: qiutuan-all-powerful-springboot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 上传文件大小限制（与 FileController 业务上限对齐）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Spring AI Alibaba（DashScope / 通义千问），生产必须配置真实 DASHSCOPE_API_KEY
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:sk-ws-H.EYDMRYX.kd8F.MEUCIQCbAM7bpN8Oo_c1iZmPYJXoZH3BG0pEp7gT0kvc3SYuNgIgHOdNH-1wgDy1UhQ2S7v95nIt5m6kdqa-agBnvZOsxuY}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3.7-plus}
          temperature: 0.7
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
      base-url: https://llm-5js5c5n8824f6iz4.cn-beijing.maas.aliyuncs.com/compatible-mode


mybatis-plus:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true
    # 默认不打印 SQL
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000          # token 有效期（秒），30 天
  active-timeout: 1800      # 最低活跃频率（秒），30分钟无操作自动失效，配合自动续签
  is-concurrent: true       # 允许同一账号多地登录
  is-share: true            # 多人登录时共用一个 token
  token-style: uuid
  is-log: false
  is-read-cookie: false     # 从 header 读取 token
  is-read-header: true
  is-write-header: true     # 登录后把 token 写入响应头
  cookie:
    http-only: true         # 开启 HttpOnly 抵御 XSS 窃取 Cookie 风险
    secure: true            # 开启 Secure 确保只能在 HTTPS 传输

# 应用自定义配置
app:
  ai:
    # RAG 知识库目录（相对工作目录，启动时自动加载 .md/.txt）
    knowledge-path: ${AI_KNOWLEDGE_PATH:./data/knowledge}
  cors:
    # 生产跨域允许来源白名单，禁止使用 *
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rag:
    prompt-template: "Context information is below. Please answer the user's question based strictly on this context. Do not make up any information or use prior knowledge outside of the context. If the context does not contain the answer, reply honestly that you do not know or the knowledge base has no related content.\n---------------------\n{question_answer_context}\n---------------------\nUser's Question: {query}"
    empty-context-template: "抱歉，根据知识库内容，没有找到与“{query}”相关的信息。"

# 接口文档配置
knife4j:
  enable: false
  production: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - top.qtcc.qiutuanallpowerfulspringboot.controller
          - top.qtcc.qiutuanallpowerfulspringboot.ai.controller
