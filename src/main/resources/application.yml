# ============================================================
# 公共配置（所有环境生效）
# 环境差异配置见 application-dev.yml / application-prod.yml
# 激活方式：SPRING_PROFILES_ACTIVE=prod（默认 dev）
# ============================================================

server:
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: qiutuan-all-powerful-springboot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 上传文件大小限制（与 FileController 业务上限对齐）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Spring AI Alibaba（DashScope / 通义千问），生产必须配置真实 DASHSCOPE_API_KEY
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-xxx}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4

mybatis-plus:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000          # token 有效期（秒），30 天
  active-timeout: -1        # 最低活跃频率，-1 不检查
  is-concurrent: true       # 允许同一账号多地登录
  is-share: true            # 多人登录时共用一个 token
  token-style: uuid
  is-log: false
  is-read-cookie: false     # 从 header 读取 token
  is-read-header: true
  is-write-header: true     # 登录后把 token 写入响应头

# 应用自定义配置
app:
  ai:
    # RAG 知识库目录（相对工作目录，启动时自动加载 .md/.txt）
    knowledge-path: ${AI_KNOWLEDGE_PATH:./data/knowledge}

# 接口文档配置
knife4j:
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - top.qtcc.qiutuanallpowerfulspringboot.controller
          - top.qtcc.qiutuanallpowerfulspringboot.ai.controller
