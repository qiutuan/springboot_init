# ============================================================
# 生产环境配置（SPRING_PROFILES_ACTIVE=prod）
# 所有敏感信息一律通过环境变量注入，无默认值，缺失即启动失败（fail-fast）
# 必填环境变量：DB_URL / DB_USERNAME / DB_PASSWORD / REDIS_HOST / REDIS_PASSWORD
#               COS_* 或 MINIO_*（按所选对象存储）/ DASHSCOPE_API_KEY
# ============================================================

server:
  port: ${SERVER_PORT:8800}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 生产连接池
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 30000
      max-lifetime: 1800000
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD}
    timeout: 10s
    lettuce:
      pool:
        min-idle: ${REDIS_POOL_MIN_IDLE:5}
        max-idle: ${REDIS_POOL_MAX_IDLE:20}
        max-active: ${REDIS_POOL_MAX_ACTIVE:50}
        max-wait: 3000ms

# 生产不打印 SQL
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 腾讯云对象存储（生产必须配置）
cos:
  client:
    accessKey: ${COS_ACCESS_KEY}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}

# MinIO 对象存储（生产必须配置）
minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

# 选择使用的对象存储：MinioManager | CosManager
file:
  manager: ${FILE_MANAGER:MinioManager}

app:
  cors:
    # 生产跨域白名单（必填，逗号分隔，禁止 *）
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 生产默认关闭接口文档（需要时 KNIFE4J_ENABLE=true）
knife4j:
  enable: ${KNIFE4J_ENABLE:false}

logging:
  level:
    root: info
    top.qtcc.qiutuanallpowerfulspringboot: info
